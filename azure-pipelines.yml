trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: Usar Node.js 24
    inputs:
      versionSpec: "24.x"

  - script: npm install --global pnpm@11.1.3
    displayName: Instalar pnpm

  - script: pnpm install --frozen-lockfile
    displayName: Instalar dependências

  - script: pnpm lint
    displayName: Executar lint

  - script: pnpm typecheck
    displayName: Validar TypeScript

  - script: pnpm test:unit
    displayName: Executar testes unitários

  - script: pnpm build:production
    displayName: Gerar build de frontend e backend